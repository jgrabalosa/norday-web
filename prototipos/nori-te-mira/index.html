<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nori te mira</title>
<style>
/* VOICE: tranquila y tierna, como la app.
   IDEA: el centro de norday.app, con Nori viva mirándote.
   PICTURE: Nori grande, sola, con su sombra en el suelo.
   COLOUR and TYPE: papel #FFFCF5, grafito #2E2723, verde #15924F; Patrick Hand SC.
   LAYOUT: Nori en el centro de la primera pantalla; el texto, poco y debajo. */
:root{color-scheme:light dark;--bg:light-dark(#FFFCF5,#1d1a18);--ink:light-dark(#2E2723,#f3ede4);--soft:light-dark(#6f645c,#b9ada1);--verde:light-dark(#15924F,#3fc47e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Patrick Hand SC","Patrick Hand",system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:18px max(5vw,16px)}
.marca{font-size:24px;letter-spacing:.5px}
.marca b{color:var(--verde);font-weight:400}
main{flex:1;display:grid;place-items:center;padding:0 16px;touch-action:none}
.escena{position:relative;width:min(96vw,calc(72vh * 0.75),585px);aspect-ratio:660/880}
.escena canvas,.escena img{position:absolute;inset:0;width:100%;height:100%}
.escena img{object-fit:contain;padding:3% 0 5.5%;transition:opacity .4s}
.escena.lista img{opacity:0}
.suelo{position:absolute;left:18%;right:22%;bottom:3.5%;height:4.5%;border-radius:50%;background:radial-gradient(closest-side,rgba(46,39,35,.16),rgba(46,39,35,0));}
.texto{text-align:center;padding:0 16px 22px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0 0 6px;font-weight:400;text-wrap:balance}
p{margin:0;color:var(--soft);font-size:16px}
.nota{font-size:13px;margin-top:10px;opacity:.75}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="marca">Norday <b>Habits</b></div></header>
<main id="zona">
  <div class="escena" id="escena">
    <img src="nori.png" alt="Nori, la mascota de Norday Habits">
    <canvas id="nori" width="660" height="880" aria-hidden="true"></canvas>
  </div>
</main>
<div class="texto">
  <h1>Nori crece contigo.</h1>
  <p>La app de hábitos sin presión.</p>
  <p class="nota" id="nota">Prototipo: mueve el ratón o el dedo. Si no haces nada, mira sola; a los 15 segundos se duerme.</p>
</div>
<script src="rive.js"></script>
<script src="nori-riv.js"></script>
<script>
{
  const canvas = document.getElementById('nori');
  const escena = document.getElementById('escena');
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CARA = { x: (514 - 182) / 660, y: (451 - 60) / 880 };       // centro de la pantalla de Nori en el dibujo
  let mx, my, dormido, objX = 50, objY = 50, curX = 50, curY = 50;
  let ultimo = performance.now(), proximaMirada = 0, durmiendo = false;

  try { rive.RuntimeLoader.setWasmUrl('rive.wasm'); rive.Rive.suppressDeprecationWarnings = ['state-machine-inputs']; } catch (e) {}
  const r = new rive.Rive({
    buffer: Uint8Array.from(atob(window.NORI_RIV), c => c.charCodeAt(0)).buffer, canvas, autoplay: !quieto, stateMachine: 'Nori',
    layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
    onLoad: () => {
      r.resizeDrawingSurfaceToCanvas();
      const ins = r.stateMachineInputs('Nori') || [];
      mx = ins.find(i => i.name === 'mirarX'); my = ins.find(i => i.name === 'mirarY'); dormido = ins.find(i => i.name === 'dormido');
      escena.classList.add('lista');
      if (quieto) { document.getElementById('nota').textContent = 'Tienes activado «reducir movimiento»: Nori se queda quieta.'; return; }
      requestAnimationFrame(paso);
    },
    onLoadError: () => { document.getElementById('nota').textContent = 'No se ha podido cargar la animación: se ve el dibujo.'; }
  });
  new ResizeObserver(() => { try { r.resizeDrawingSurfaceToCanvas(); } catch (e) {} }).observe(canvas);

  function mira(ev) {
    const b = canvas.getBoundingClientRect();
    const cx = b.left + b.width * CARA.x, cy = b.top + b.height * CARA.y;
    const dx = (ev.clientX - cx) / Math.max(240, innerWidth * 0.42);
    const dy = (ev.clientY - cy) / Math.max(240, innerHeight * 0.42);
    objX = 50 + 50 * Math.max(-1, Math.min(1, dx));
    objY = 50 + 50 * Math.max(-1, Math.min(1, dy));
    ultimo = performance.now();
    if (durmiendo) { durmiendo = false; if (dormido) dormido.value = false; }
  }
  addEventListener('pointermove', mira, { passive: true });
  addEventListener('pointerdown', mira, { passive: true });

  function paso(t) {
    const quietoMs = t - ultimo;
    if (quietoMs > 15000 && !durmiendo) { durmiendo = true; if (dormido) dormido.value = true; objX = 50; objY = 55; }
    else if (quietoMs > 4000 && !durmiendo && t > proximaMirada) {      // mira sola: a un sitio cualquiera, sin prisa
      objX = 15 + Math.random() * 70; objY = 30 + Math.random() * 45;
      proximaMirada = t + 1400 + Math.random() * 1800;
    }
    curX += (objX - curX) * 0.12; curY += (objY - curY) * 0.12;
    if (mx && Math.abs(mx.value - curX) > 0.05) mx.value = curX;
    if (my && Math.abs(my.value - curY) > 0.05) my.value = curY;
    requestAnimationFrame(paso);
  }
}
</script>
</body>
</html>
